<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam's Moving - Free Quote</title>
<style>
  :root {
    --accent: #2a9d8f;
    --accent-dark: #1c6b62;
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    padding: 40px 20px 56px;
    text-align: center;
  }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0; opacity: .9; font-size: 15px; }
  .wrap {
    max-width: 760px;
    margin: -32px auto 60px;
    padding: 0 16px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 17px;
    margin: 0 0 16px;
    color: var(--accent-dark);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .grid.full, .field.span2 { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  .checks { display: flex; gap: 18px; align-items: center; margin-top: 4px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .checks input { width: auto; }
  button {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #status {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  #status.ok { display: block; background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  #status.err { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>Sam's Moving</h1>
  <p>Fast, careful, professional moving services - Get your free quote in 2 minutes</p>
</header>
<div class="wrap">
  <form id="quoteForm">
    <div class="card">
      <h2>Your contact info</h2>
      <div class="grid">
        <div class="field"><label>First name</label><input name="prenom" required></div>
        <div class="field"><label>Last name</label><input name="nom" required></div>
        <div class="field"><label>Phone</label><input name="telephone" type="tel" required placeholder="(555) 000-0000"></div>
        <div class="field"><label>Email</label><input name="courriel" type="email" required></div>
      </div>
    </div>

    <div class="card">
      <h2>Moving date</h2>
      <div class="grid">
        <div class="field"><label>Preferred date</label><input name="date_demenagement" type="date" required></div>
        <div class="field"><label>Is this date fixed?</label>
          <select name="date_fixe">
            <option value="oui">Yes, fixed date</option>
            <option value="non">No, flexible</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Pickup address</h2>
      <div class="grid">
        <div class="field"><label>Home type</label>
          <select name="origine_type">
            <option>Apartment</option>
            <option>House</option>
            <option>Condo</option>
            <option>Storage / other</option>
          </select>
        </div>
        <div class="field"><label>Number of rooms</label><input name="origine_pieces" placeholder="e.g. 2 bedroom"></div>
        <div class="field"><label>Floor</label><input name="origine_etage" placeholder="e.g. 2nd floor"></div>
        <div class="field"><label>Access</label>
          <select name="origine_acces">
            <option>Elevator</option>
            <option>Stairs</option>
            <option>Ground floor</option>
          </select>
        </div>
        <div class="field span2"><label>Address</label><input name="origine_adresse" required></div>
        <div class="field"><label>City</label><input name="origine_ville" required></div>
        <div class="field"><label>State</label><input name="origine_province" value=""></div>
        <div class="field"><label>Zip code</label><input name="origine_codepostal"></div>
        <div class="field span2 checks">
          <label><input type="checkbox" name="origine_animaux" value="oui"> Pets</label>
        </div>
        <div class="field span2"><label>Notes (fragile items, piano, etc.)</label><textarea name="origine_notes" placeholder="Additional info"></textarea></div>
      </div>
    </div>

    <div class="card">
      <h2>Delivery address</h2>
      <div class="grid">
        <div class="field"><label>Home type</label>
          <select name="dest_type">
            <option>Apartment</option>
            <option>House</option>
            <option>Condo</option>
            <option>Storage / other</option>
          </select>
        </div>
        <div class="field"><label>Number of rooms</label><input name="dest_pieces" placeholder="e.g. 2 bedroom"></div>
        <div class="field span2"><label>Address</label><input name="dest_adresse" required></div>
        <div class="field"><label>City</label><input name="dest_ville" required></div>
        <div class="field"><label>State</label><input name="dest_province" value=""></div>
        <div class="field"><label>Zip code</label><input name="dest_codepostal"></div>
        <div class="field span2"><label>Notes (fragile items, piano, etc.)</label><textarea name="dest_notes" placeholder="Additional info"></textarea></div>
      </div>
    </div>

    <div class="card">
      <button type="submit" id="submitBtn">Get my free quote</button>
      <div id="status"></div>
      <p class="note">By submitting this form, one of our representatives will contact you shortly.</p>
    </div>
  </form>
</div>
<footer>Sam's Moving - Quote form simulation</footer>

<script>
  // TODO: replace with your live n8n webhook URL once known
  // e.g. "https://YOUR-N8N-HOST/webhook/sams-moving-quote"
  const WEBHOOK_URL = "https://YOUR-N8N-HOST/webhook/sams-moving-quote";

  const form = document.getElementById('quoteForm');
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {};
    for (const [k, v] of fd.entries()) {
      data[k] = v;
    }
    if (!data.origine_animaux) data.origine_animaux = 'non';

    btn.disabled = true;
    btn.textContent = 'Sending...';
    statusEl.className = '';
    statusEl.style.display = 'none';

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      statusEl.textContent = "Thanks! Your request was sent. We'll be in touch shortly.";
      statusEl.className = 'ok';
      form.reset();
    } catch (err) {
      statusEl.textContent = "Something went wrong sending your request. Please try again.";
      statusEl.className = 'err';
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Get my free quote';
    }
  });
</script>
</body>
</html>
